name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 注意：内置 GITHUB_TOKEN 回推的 commit/tag 不会再次触发 workflow（防递归），
# 因此「自动发版」必须在同一个 job 内一次完成：bump → commit → tag → 回推 → 构建 → Release。

jobs:
  # ---------- main 推送：全自动发版 ----------
  # 版本号规则：最新 tag 的 patch+1；versionCode +1。HEAD 已是最新 tag 时跳过（防重复）。
  release-on-main:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Bump version, commit, tag, push
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          latest=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$latest" ]; then
            major=0; minor=0; patch=0; skip=false
          else
            IFS='.' read -r major minor patch <<< "${latest#v}"
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse "$latest^{commit}")" ]; then
              echo "HEAD already equals latest tag $latest, nothing to release"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            skip=false
          fi
          next="v$major.$minor.$((patch + 1))"
          ver="$major.$minor.$((patch + 1))"
          vc=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          vc=$((vc + 1))
          sed -i "s/versionCode = [0-9]*/versionCode = $vc/" app/build.gradle.kts
          sed -i "s/versionName = \"[0-9.]*\"/versionName = \"$ver\"/" app/build.gradle.kts
          if [ -z "$(git diff --stat)" ]; then
            echo "version already up to date, nothing to commit"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "release: version $ver"
          git tag "$next" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$next" 2>/dev/null || true
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "pushed $next"

      - name: Configure release signing (if secrets provided)
        if: steps.bump.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
            printf 'storeFile=keystore/release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "release signing enabled"
          else
            echo "no signing secrets -> release will use debug signing"
          fi
      - uses: actions/setup-java@v6
        if: steps.bump.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6.3.0
        if: steps.bump.outputs.skip != 'true'
      - name: Assemble release APK
        if: steps.bump.outputs.skip != 'true'
        run: ./gradlew assembleRelease --console=plain
      - name: Publish GitHub Release
        if: steps.bump.outputs.skip != 'true'
        run: |
          gh release create "${{ steps.bump.outputs.next }}" app/build/outputs/apk/release/*.apk \
            --title "MusicFreeTV ${{ steps.bump.outputs.next }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- tag 推送 / PR / 手动：构建（tag 时发布，幂等） ----------
  build:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Configure release signing (if secrets provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
            printf 'storeFile=keystore/release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "release signing enabled"
          else
            echo "no signing secrets -> release will use debug signing"
          fi
      - name: Assemble release APK
        run: ./gradlew assembleRelease --console=plain
      - name: Upload APK artifact (PR / manual)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
      - name: Publish GitHub Release (tags, idempotent)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists, skip"
          else
            gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/*.apk \
              --title "MusicFreeTV $GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}