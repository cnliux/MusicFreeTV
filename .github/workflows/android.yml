name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 回推的 commit/tag 不会再次触发 workflow（防递归）。
# release-on-main job 在单次 run 内完成：算版本 → 改 versionCode/versionName → 
# 提交 → 打 tag → 回推 main+tag → 签出构建（生产签名） → gh release create。
# 因此主流程无需 workflow_dispatch。

jobs:
  # ---------- push main：自动 bump 版本 + 构建 release + 发布 GitHub Release ----------
  release-on-main:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          printf 'storeFile=keystore/release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - name: Bump version & assemble release
        run: |
          # 取最新 v* tag 的 patch 号 +1；无 tag 则从 0.1.0 起步
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LAST_VER=${LAST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_VER"
          PATCH=$((PATCH + 1))
          NEW_VER="$MAJOR.$MINOR.$PATCH"
          NEW_CODE=$(grep -oP 'versionCode\s+\K\d+' app/build.gradle.kts | tail -1 | tr -d ' ')
          NEW_CODE=$((NEW_CODE + 1))
          # 写入新版本
          sed -i "s/versionCode = \d*/versionCode = $NEW_CODE/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$NEW_VER\"/" app/build.gradle.kts
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "release: version $NEW_VER" || echo "no version change"
          git tag "v$NEW_VER"
          git push origin main
          git push origin "v$NEW_VER"
          echo "NEW_VER=$NEW_VER" >> $GITHUB_ENV
          echo "NEW_CODE=$NEW_CODE" >> $GITHUB_ENV
      - name: Assemble release APK
        run: ./gradlew assembleRelease --console=plain
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
      - name: Publish GitHub Release
        run: |
          if gh release view "v$NEW_VER" >/dev/null 2>&1; then
            echo "release v$NEW_VER already exists, skip"
          else
            gh release create "v$NEW_VER" app/build/outputs/apk/release/*.apk \
              --title "MusicFreeTV v$NEW_VER" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- workflow_dispatch / tag push：幂等构建 + 发布 ----------
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          printf 'storeFile=keystore/release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - name: Assemble release APK
        run: ./gradlew assembleRelease --console=plain
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, skip"
          else
            gh release create "$TAG" app/build/outputs/apk/release/*.apk \
              --title "MusicFreeTV $TAG" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
